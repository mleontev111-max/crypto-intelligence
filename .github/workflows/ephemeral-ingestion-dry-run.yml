name: Ephemeral Ingestion Dry Run

on:
  push:
    branches: [main]
    paths:
      - 'src/adapters/coinbase_exchange_candles.py'
      - 'src/adapters/fred_h15_treasury.py'
      - 'src/transport/read_only_http.py'
      - 'src/ingestion/**'
      - 'scripts/e2e_approved_ingestion_dry_run.py'
      - 'db/migrations/**'
      - '.github/workflows/ephemeral-ingestion-dry-run.yml'
  pull_request:
    paths:
      - 'src/adapters/coinbase_exchange_candles.py'
      - 'src/adapters/fred_h15_treasury.py'
      - 'src/transport/read_only_http.py'
      - 'src/ingestion/**'
      - 'scripts/e2e_approved_ingestion_dry_run.py'
      - 'db/migrations/**'
      - '.github/workflows/ephemeral-ingestion-dry-run.yml'

permissions:
  contents: read

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: ci
  PGPASSWORD: ci
  PGDATABASE: crypto_intelligence_test

jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crypto_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crypto_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require runtime FRED secret
        shell: bash
        run: |
          test -n "$FRED_API_KEY"
          echo "FRED_API_KEY configured: ***"

      - name: Install PostgreSQL Python client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Apply Phase 0 schema
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_core_provenance.up.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_core_invariants.up.sql

      - name: Run approved-source end-to-end dry run
        run: python scripts/e2e_approved_ingestion_dry_run.py

      - name: Confirm database is disposable and live ingestion remains disabled
        shell: bash
        run: |
          python - <<'PY'
          import json
          state = json.load(open('PROJECT_STATE.json', encoding='utf-8'))
          assert state['live_ingestion_allowed'] is False
          print('persistent live ingestion remains disabled')
          PY
