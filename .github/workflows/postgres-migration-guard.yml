name: PostgreSQL Migration Guard

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'src/ingestion/**'
      - 'tests/test_raw_first_ingestion.py'
      - '.github/workflows/postgres-migration-guard.yml'
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'src/ingestion/**'
      - 'tests/test_raw_first_ingestion.py'
      - '.github/workflows/postgres-migration-guard.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crypto_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crypto_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: crypto_intelligence_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RAW-first deterministic tests
        run: python -m unittest tests.test_raw_first_ingestion -v

      - name: Apply migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_core_provenance.up.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_core_invariants.up.sql

      - name: Verify core tables and triggers
        shell: bash
        run: |
          tables=$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('data_sources','raw_events','observations','observation_raw_events','data_snapshots','data_snapshot_components','model_versions','target_definitions','forecasts','forecast_probabilities','forecast_outcomes');")
          test "$tables" = "11"
          triggers=$(psql -Atc "SELECT count(*) FROM pg_trigger WHERE tgname IN ('forecasts_append_only','data_snapshot_components_cutoff_guard','forecast_probability_vector_guard','forecast_outcome_target_guard') AND NOT tgisinternal;")
          test "$triggers" = "4"

      - name: Verify minimal RAW-first transaction
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO data_sources(source_id,category,provider,dataset,status,point_in_time_rating,revision_policy,terms_review_status)
          VALUES ('market.coinbase.exchange.btcusd.candles','market','Coinbase Exchange','BTC-USD candles','approved','conditional','append','reviewed');

          BEGIN;
          INSERT INTO raw_events(raw_event_id,source_id,source_record_id,source_event_at,observed_at,ingested_at,available_at,content_hash,payload_ref,mime_type)
          VALUES ('10000000-0000-5000-8000-000000000001','market.coinbase.exchange.btcusd.candles','fixture-request-v1','2026-09-01T00:00:00Z','2026-09-04T12:40:56Z','2026-09-04T12:41:00Z','2026-09-04T12:40:56Z','fixture-hash-v1','fixture://coinbase-v1','application/json')
          ON CONFLICT (raw_event_id) DO NOTHING;
          INSERT INTO observations(observation_id,metric_id,asset,venue,value,unit,event_at,available_at,quality_status,normalizer_version)
          VALUES ('20000000-0000-5000-8000-000000000001','market.close','BTC','coinbase',108253.09,'USD','2026-09-01T00:00:00Z','2026-09-04T12:40:56Z','valid','coinbase-candles-v0.1')
          ON CONFLICT (observation_id) DO NOTHING;
          INSERT INTO observation_raw_events(observation_id,raw_event_id)
          VALUES ('20000000-0000-5000-8000-000000000001','10000000-0000-5000-8000-000000000001')
          ON CONFLICT DO NOTHING;
          COMMIT;

          BEGIN;
          INSERT INTO raw_events(raw_event_id,source_id,source_record_id,source_event_at,observed_at,ingested_at,available_at,content_hash,payload_ref,mime_type)
          VALUES ('10000000-0000-5000-8000-000000000001','market.coinbase.exchange.btcusd.candles','fixture-request-v1','2026-09-01T00:00:00Z','2026-09-04T12:40:56Z','2026-09-04T12:41:00Z','2026-09-04T12:40:56Z','fixture-hash-v1','fixture://coinbase-v1','application/json')
          ON CONFLICT (raw_event_id) DO NOTHING;
          INSERT INTO observations(observation_id,metric_id,asset,venue,value,unit,event_at,available_at,quality_status,normalizer_version)
          VALUES ('20000000-0000-5000-8000-000000000001','market.close','BTC','coinbase',108253.09,'USD','2026-09-01T00:00:00Z','2026-09-04T12:40:56Z','valid','coinbase-candles-v0.1')
          ON CONFLICT (observation_id) DO NOTHING;
          INSERT INTO observation_raw_events(observation_id,raw_event_id)
          VALUES ('20000000-0000-5000-8000-000000000001','10000000-0000-5000-8000-000000000001')
          ON CONFLICT DO NOTHING;
          COMMIT;
          SQL

          test "$(psql -Atc "SELECT count(*) FROM raw_events WHERE raw_event_id='10000000-0000-5000-8000-000000000001';")" = "1"
          test "$(psql -Atc "SELECT count(*) FROM observations WHERE observation_id='20000000-0000-5000-8000-000000000001';")" = "1"
          test "$(psql -Atc "SELECT count(*) FROM observation_raw_events WHERE observation_id='20000000-0000-5000-8000-000000000001';")" = "1"

      - name: Verify transaction rollback leaves no partial RAW unit
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO raw_events(raw_event_id,source_id,source_record_id,observed_at,ingested_at,available_at,content_hash,payload_ref)
          VALUES ('10000000-0000-5000-8000-000000000002','market.coinbase.exchange.btcusd.candles','fixture-request-fail','2026-09-04T12:42:00Z','2026-09-04T12:42:01Z','2026-09-04T12:42:00Z','fixture-hash-fail','fixture://fail');
          INSERT INTO observations(observation_id,metric_id,asset,value,unit,event_at,available_at,quality_status,normalizer_version)
          VALUES ('20000000-0000-5000-8000-000000000002','market.close','BTC',1,'USD','2026-09-01T00:00:00Z','2026-09-04T12:42:00Z','not-valid','test');
          COMMIT;
          SQL
          then
            echo 'expected transaction to fail'
            exit 1
          fi
          test "$(psql -Atc "SELECT count(*) FROM raw_events WHERE raw_event_id='10000000-0000-5000-8000-000000000002';")" = "0"

      - name: Seed minimal valid forecast chain
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO data_snapshots(data_snapshot_id,created_at,cutoff_available_at,manifest_hash)
          VALUES ('00000000-0000-7000-8000-000000000001', now(), now(), 'manifest-000000000001');
          INSERT INTO model_versions(model_version_id,model_family,created_at,code_commit_sha,training_snapshot_id,config_hash,artifact_ref,status)
          VALUES ('baseline-v0','baseline',now(),'0000000','00000000-0000-7000-8000-000000000001','config-hash-00000001','artifact://baseline','baseline');
          INSERT INTO target_definitions(target_definition_id,asset_scope,horizon,definition_json,created_at,code_commit_sha,status)
          VALUES ('btc-4h-test','BTC','4h','{}',now(),'0000000','research'),
                 ('btc-4h-other','BTC','4h','{}',now(),'0000000','research');
          INSERT INTO forecasts(forecast_id,created_at,asset,horizon,target_definition_id,venue,symbol,reference_price,reference_observed_at,model_version_id,data_snapshot_id,status)
          VALUES ('00000000-0000-7000-8000-000000000010',now(),'BTC','4h','btc-4h-test','test','BTCUSDT',100000,now(),'baseline-v0','00000000-0000-7000-8000-000000000001','open');
          BEGIN;
          INSERT INTO forecast_probabilities(forecast_id,class_key,probability) VALUES
            ('00000000-0000-7000-8000-000000000010','DOWN',0.2),
            ('00000000-0000-7000-8000-000000000010','RANGE',0.5),
            ('00000000-0000-7000-8000-000000000010','UP',0.3);
          COMMIT;
          SQL

      - name: Reject snapshot cutoff violation
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO data_snapshot_components(data_snapshot_id,dataset_id,version_or_query_hash,max_available_at) VALUES ('00000000-0000-7000-8000-000000000001','future','hash', (SELECT cutoff_available_at + interval '1 second' FROM data_snapshots WHERE data_snapshot_id='00000000-0000-7000-8000-000000000001'));"; then
            echo 'expected snapshot cutoff violation to fail'
            exit 1
          fi

      - name: Reject outcome target mismatch
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO forecast_outcomes(outcome_id,forecast_id,resolved_at,target_definition_id,realized_class,realized_return,resolution_data_snapshot_id) VALUES ('00000000-0000-7000-8000-000000000020','00000000-0000-7000-8000-000000000010',now(),'btc-4h-other','UP',0.01,'00000000-0000-7000-8000-000000000001');"; then
            echo 'expected outcome target mismatch to fail'
            exit 1
          fi

      - name: Reject invalid probability vector
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO forecasts(forecast_id,created_at,asset,horizon,target_definition_id,venue,symbol,reference_price,reference_observed_at,model_version_id,data_snapshot_id,status) VALUES ('00000000-0000-7000-8000-000000000011',now(),'BTC','4h','btc-4h-test','test','BTCUSDT',100000,now(),'baseline-v0','00000000-0000-7000-8000-000000000001','open');"
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO forecast_probabilities(forecast_id,class_key,probability) VALUES
            ('00000000-0000-7000-8000-000000000011','DOWN',0.4),
            ('00000000-0000-7000-8000-000000000011','UP',0.7);
          COMMIT;
          SQL
          then
            echo 'expected invalid probability vector to fail at commit'
            exit 1
          fi

      - name: Roll back migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_core_invariants.down.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_core_provenance.down.sql

      - name: Verify rollback removed core tables
        shell: bash
        run: |
          count=$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('data_sources','raw_events','observations','observation_raw_events','data_snapshots','data_snapshot_components','model_versions','target_definitions','forecasts','forecast_probabilities','forecast_outcomes');")
          test "$count" = "0"

      - name: Re-apply migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_core_provenance.up.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_core_invariants.up.sql
