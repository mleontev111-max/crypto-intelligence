name: Market Adapter Guard

on:
  push:
    branches: [main]
    paths:
      - 'src/adapters/**'
      - 'src/transport/**'
      - 'scripts/probe_approved_sources.py'
      - 'tests/test_coinbase_exchange_candles.py'
      - 'tests/test_fred_h15_treasury.py'
      - 'tests/test_read_only_http.py'
      - 'docs/architecture/COINBASE_BTCUSD_CANDLES_ADAPTER_v0.1.md'
      - 'docs/architecture/FRED_H15_TREASURY_ADAPTER_v0.1.md'
      - 'docs/architecture/DATA_SOURCE_REGISTRY.md'
      - '.github/workflows/market-adapter-guard.yml'
  pull_request:
    paths:
      - 'src/adapters/**'
      - 'src/transport/**'
      - 'scripts/probe_approved_sources.py'
      - 'tests/test_coinbase_exchange_candles.py'
      - 'tests/test_fred_h15_treasury.py'
      - 'tests/test_read_only_http.py'
      - 'docs/architecture/COINBASE_BTCUSD_CANDLES_ADAPTER_v0.1.md'
      - 'docs/architecture/FRED_H15_TREASURY_ADAPTER_v0.1.md'
      - 'docs/architecture/DATA_SOURCE_REGISTRY.md'
      - '.github/workflows/market-adapter-guard.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic write-free tests
        run: python -m unittest tests.test_coinbase_exchange_candles tests.test_fred_h15_treasury tests.test_read_only_http -v
      - name: Assert source-probe code has no database or trading client imports
        shell: bash
        run: |
          ! grep -Eiq 'psycopg|sqlalchemy|create_order|place_order|/orders|/accounts' src/adapters/*.py src/transport/*.py scripts/probe_approved_sources.py
      - name: Assert no literal credential values are committed
        shell: bash
        run: |
          ! grep -Eiq '(api[_-]?key|secret)[[:space:]]*=[[:space:]]*["'\''][A-Za-z0-9_-]{16,}' src/adapters/*.py src/transport/*.py scripts/probe_approved_sources.py
      - name: Live zero-write Coinbase probe
        run: python scripts/probe_approved_sources.py coinbase
